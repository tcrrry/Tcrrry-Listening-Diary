<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="color-scheme" content="light dark"><link rel="stylesheet" href="popup.css"></head>
<body>
<header class="header"><div><div class="eyebrow">LISTENING DIARY · WEB</div><h1>听歌日记</h1><p>在网页上，让音乐留下痕迹</p></div><img class="mark" src="icons/icon-128.png" alt=""></header>
<main>
<section class="now card"><div class="section-label"><span>正在聆听</span><span id="live" class="live">等待播放</span></div><div class="now-content"><div class="cover" id="cover"><span>♫</span><img id="art" alt="" hidden></div><div class="now-info"><div id="now-title" class="now-title">下一段音乐记忆，正在路上</div><div id="now-artist" class="muted">打开 Apple Music 网页开始播放</div><div id="now-time" class="now-time">已听 0 秒</div></div></div></section>
<section class="stats" aria-label="网页本机统计"><div><strong id="plays">—</strong><span>次有效播放</span></div><div><strong id="minutes">—</strong><span>分钟</span></div><div><strong id="songs">—</strong><span>首歌曲</span></div><div><strong id="artists">—</strong><span>位歌手</span></div></section>
<section class="card sync"><div class="section-head"><h2>多设备同步</h2><span class="pill" id="paired-label">读取中</span></div><p id="sync-status" class="muted sync-status"></p><div id="pair-form" hidden><p class="muted hint">在听歌日记的“多设备同步”中显示配对码，输入局域网地址和六位配对码。</p><label class="sr-only" for="host">局域网 IP</label><input id="host" placeholder="日记的局域网 IP" autocomplete="off"><label class="sr-only" for="key">六位配对码</label><input id="key" type="password" inputmode="numeric" maxlength="6" placeholder="六位配对码" autocomplete="off"><button id="pair" class="primary">配对并同步</button></div><div class="sync-actions"><button id="change" class="text-button" hidden>更换连接</button><button id="unpair" class="text-button" hidden>解除配对</button></div></section>
<section class="history"><div class="section-head"><div><h2>最近听过</h2><p class="muted caption">在这台浏览器中记录</p></div><span id="history-count" class="muted caption"></span></div><ul id="records"></ul><p id="empty" class="empty" hidden>还没有听歌记录，播放一首喜欢的歌吧。</p></section>
<details class="exports"><summary>导出听歌记录</summary><p class="muted hint">自动同步可用时，无需手动导出。</p><div class="export-actions"><button id="diary-export" class="secondary">导出日记导入文件</button><button id="export" class="secondary">导出网页备份</button></div><p id="notice" class="muted hint" aria-live="polite"></p></details>
</main><script type="module" src="popup.js"></script></body></html>
